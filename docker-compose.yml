services:

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: ai-resume-backend
    ports:
      - "8000:8000"

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_URL: http://localhost:8000
    container_name: ai-resume-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend